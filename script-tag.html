<!DOCTYPE HTML>
<html>
    <head>
        <!-- Include external script in the head section: -->
        <script type="text/javascript" src="tags.js"></script>
    </head>
    <body><h6><a style="color: crimson; text-decoration: underline;" href="html-elements.html" target="_self">Return to HTML Elements</a></h6>        
        <p>A <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/script" target="_blank">script tag</a></p>
        <p>This element can also be used with other languages, such as WebGL's GLSL shader programming language and JSON</p>
        <p>Usually at the end of the document right before the closing body tag, and also in the head tag to load libraries.</p>
        
        <!-- Execute script in the body: -->
        <!-- OPEN ON A "LIVE SERVER" -->
        <script>
            document.write('This text has been added with JavaScript');
        </script>

    </body>
</html>
